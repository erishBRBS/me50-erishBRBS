{% extends "encyclopedia/layout.html" %}

{% block title %}
    Create New Page
{% endblock %}

{% block body %}
    <h1>Create New Page</h1>

    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form action="{% url 'encyclopedia:new_page' %}" method="post" class="entry-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Page</button>
    </form>
{% endblock %}
